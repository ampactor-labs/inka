[package]
name = "mentl-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = "47"
wasmtime-wasi = "47"

[profile.release]
# cranelift compiles the 19MB wheel module at startup; the runner itself is
# thin — release opt keeps the JIT step in the same band as the CLI's.
opt-level = 2
